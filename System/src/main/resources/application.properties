server.port=8082
spring.application.name=demo
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# DataSource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/road_data
spring.datasource.username=root
spring.datasource.password=a8717059
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# MyBatis Configuration
mybatis.type-aliases-package=top.bultrail.markroad.pojo
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
# Set MyBatis log level DEBUG
logging.level.org.mybatis.spring=DEBUG
#logging.level.org.springframework=DEBUG
logging.level.top.bultrail.markroad.mapper=DEBUG
#Whether to open file upload support, the default is true
spring.servlet.multipart.enabled=true
#The threshold for writing files to disk, the default is 0
spring.servlet.multipart.file-size-threshold=0
#Temporary save location of upload file
#spring.servlet.multipart.location=\/Volumes\/Data\/mytest
#The maximum value of a single file, the default is 1MB
spring.servlet.multipart.max-file-size=1MB
#The total size of multiple files uploaded, the default is 10MB
spring.servlet.multipart.max-request-size=10MB
#Whether to delay parsing, the default is false
spring.servlet.multipart.resolve-lazily=false

# 前端接口配置
spring.profiles.active=dev
frontend.dev.url=http://localhost:3000
spring.web.resources.cache.period=0

# 算法接口配置(单无人车)
python.wsn.url=http://127.0.0.1:5000/api/runWSN
python.greedy.url=http://127.0.0.1:5000/api/runGreedy
python.RAWCS.url=http://127.0.0.1:5000/api/runRAWCS
#python.aco.url=http://127.0.0.1:5000/api/runACO
python.nsga.url=http://127.0.0.1:5000/api/runNSGA
python.adrl.url=http://127.0.0.2:5001/api/runADRL

# 算法接口配置(多无人车)
python.mul.wsn.url=http://127.0.0.1:5001/api/mulRunWSN


