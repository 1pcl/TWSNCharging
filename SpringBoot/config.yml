graphhopper:
  # 关键配置项
  graph.location: graph-cache
  datareader.file: guangdong.osm.pbf

  # *** 新增的关键配置：定义 "car" 模式 ***
  profiles:
    # 定义一个名为 "car" 的配置文件
    - name: car
      # 指定使用 "car" 交通工具编码器
      vehicle: car
      # 指定使用 "shortest " 权重，即最短距离
      weighting: shortest
      # 通常建议在基础配置中关闭，除非需要详细的转向限制
      turn_costs: false

server:
  application_connectors:
    - type: http
      port: 8989

logging:
  level: DEBUG
  loggers:
    com.graphhopper: DEBUG